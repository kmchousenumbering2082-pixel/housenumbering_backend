# Backend for KMC House Numbering
# The database runs separately from ~/projects/kmc-house-numbering-database
# (container: gis-portal-database, network: gis-portal-network).

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8501:8000"
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    volumes:
      - media_data:/code/media
    networks:
      - default
      - kmc-db
    depends_on:
      - redis

  redis:
    image: redis:alpine
    restart: always
    entrypoint: redis-server --appendonly yes
    volumes:
      - ./_redis_data:/data

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    entrypoint: "celery -A src.main.celery_app worker -l INFO"
    env_file:
      - .env
    networks:
      - default
      - kmc-db
    depends_on:
      - web
      - redis

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    entrypoint: "celery -A src.main.celery_app beat -l INFO"
    env_file:
      - .env
    networks:
      - default
      - kmc-db
    depends_on:
      - web
      - redis

networks:
  kmc-db:
    external: true
    name: gis-portal-network

volumes:
  media_data:
