services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/code
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      - WATCHFILES_FORCE_POLLING=true
    # entrypoint: tail -f /dev/null
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
  

  db:
    image: postgis/postgis:16-3.4-alpine
    restart: always
    volumes:
      - ./postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bid_db 
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bid_db"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    env_file:
      - .env

  redis:
    image: redis:alpine
    restart: always
    entrypoint: redis-server --appendonly yes
    # ports:
    #   - 6379:6379
    volumes:
      - ./_redis_data:/var/lib/redis
      - ./redis/rc.local:/etc/rc.local

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /code
    restart: always
    entrypoint: "celery -A app.main.celery_app worker -f /logs/worker.log -l DEBUG"
    # entrypoint: "celery -A project worker -f /logs/worker.log -l DEBUG"
    depends_on:
      - web
      - redis
    volumes:
      - .:/code
      - ./logs/:/logs/
    env_file:
      - .env


  beat:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /code
    restart: always
    entrypoint: "celery -A app.main.celery_app beat -f /logs/beat.log -l DEBUG"
    # entrypoint: "celery -A project beat -f /logs/worker.log -l DEBUG"
    depends_on:
      - web
      - redis
    volumes:
      - .:/code
      - ./logs/:/logs/
    env_file:
      - .env
      
