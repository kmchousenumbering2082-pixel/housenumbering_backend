<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Add Password</title>
    <style>
        body {
            background-color: #A8D5F9;
        }

        .content {
            max-width: 600px;
            margin: 250px auto;
            padding: 20px;
            background-color: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            box-shadow: 8px 8px 6px rgba(0, 0, 0, 0.4);
            border-color: black;
            border-width: 1px;
        }

        .form-group label {
            margin-bottom: 0;
        }

        .show-password {
            margin-top: -15px;
            margin-bottom: 15px;
        }

        .submit-btn:hover {
            transform: scale(1.05);
            transition: background-color 0.3s ease, transform 0.3s ease;
            box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.4);
        }

        h5 {
            text-align: center;
        }

        .password-feedback {
            color: red;
            font-size: 0.9em;
        }
    </style>
</head>

<body>
    <div class="content">
        <h3 class="mb-4 text-center">Change Password</h3>
        <form class="form-signin post-form" method="POST" onsubmit="return checkPasswordRequirements()">
            <div class="form-group mb-4">
                <label for="old_password">Current Password</label>
                <input type="password" name="old_password" id="old_password" class="form-control" placeholder="••••••••"
                    required />
            </div>

            <div class="form-group mb-4">
                <label for="new_password">New Password</label>
                <input type="password" name="new_password" id="new_password" class="form-control" placeholder="••••••••"
                    required oninput="validatePassword()" />
                <div id="password_feedback" class="password-feedback"></div>
            </div>

            <div class="form-group mb-4">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" name="confirm_password" id="confirm_password" class="form-control"
                    placeholder="••••••••" required />
            </div>

            <div class="form-group show-password">
                <input type="checkbox" onclick="togglePasswordVisibility()" id="show_password_checkbox">
                <label for="show_password_checkbox">Show Password</label>
            </div>

            <input class="submit-btn"
                style="background-color: #0088F8; color: white; padding: 10px; border: none; cursor: pointer; border-radius: 7px; display: block; margin: 0 auto;"
                type="submit" value="Change Password">
        </form>
    </div>
</body>
<script>
    function togglePasswordVisibility() {
        var x = document.getElementById("new_password");
        var y = document.getElementById("confirm_password");
        x.type = x.type === "password" ? "text" : "password";
        y.type = y.type === "password" ? "text" : "password";
    }

    function validatePassword() {
        var password = document.getElementById("new_password").value;
        var feedback = document.getElementById("password_feedback");
        var specialCharRegex = /[!@#$%^&*(),.?":{}|<>]/;

        if (password.length < 6 || !specialCharRegex.test(password)) {
            feedback.textContent = "Password must be at least 6 characters long and contain at least one special character.";
        } else {
            feedback.textContent = "";
        }
    }

    function checkPasswordRequirements() {
        var password = document.getElementById("new_password").value;
        var confirmPassword = document.getElementById("confirm_password").value;
        var feedback = document.getElementById("password_feedback");
        var specialCharRegex = /[!@#$%^&*(),.?":{}|<>]/;

        // Validate length and special character
        if (password.length < 6 || !specialCharRegex.test(password)) {
            feedback.textContent = "Password must be at least 6 characters long and contain at least one special character.";
            return false;
        }

        // Validate matching passwords
        if (password !== confirmPassword) {
            feedback.textContent = "Passwords do not match.";
            return false;
        }

        feedback.textContent = "";
        return true;
    }
</script>

</html>
